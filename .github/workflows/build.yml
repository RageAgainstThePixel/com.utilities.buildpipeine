name: build
on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
      allow-security-alert:
        required: false
        type: boolean
        default: false
      alpha-streams:
        required: false
        type: string
        default: '[]'
    secrets:
      UNITY_USERNAME:
        required: true
      UNITY_PASSWORD:
        required: true
jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      matrix: ${{ fromJSON(inputs.matrix) }}
      fail-fast: false
    continue-on-error: ${{ contains(fromJSON(inputs.alpha-streams), matrix.unity-version) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Free Disk Space
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: endersonmenezes/free-disk-space@8b8cd4e2277836962939a8f3b4ea0ee4bc006156 # v4.0.1
        with:
          remove_android: true
          remove_dotnet: false
          remove_tool_cache: false

      - uses: actions/checkout@v7

      - uses: RageAgainstThePixel/unity-setup@v3
        id: unity-setup
        timeout-minutes: 45
        with:
          unity-version: ${{ matrix.unity-version }}
          build-targets: ${{ matrix.build-target }}
          # the streams include the beta and alpha, which only have prereleases until they ship
          channels: f,b,a
          allow-security-alert: ${{ inputs.allow-security-alert }}

      - uses: RageAgainstThePixel/activate-unity-license@v3
        with:
          license: personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - uses: RageAgainstThePixel/unity-action@v4
        name: ${{ matrix.build-target }}-Validate
        timeout-minutes: 30
        with:
          build-target: ${{ matrix.build-target }}
          project-path: ${{ steps.unity-setup.outputs.unity-project-path }}
          log-name: ${{ matrix.build-target }}-Validate
          args: -quit -nographics -batchmode -executeMethod Utilities.Editor.BuildPipeline.UnityPlayerBuildTools.ValidateProject -importTMProEssentialsAsset

      - uses: RageAgainstThePixel/unity-action@v4
        name: ${{ matrix.build-target }}-Build
        timeout-minutes: 30
        with:
          build-target: ${{ matrix.build-target }}
          project-path: ${{ steps.unity-setup.outputs.unity-project-path }}
          log-name: ${{ matrix.build-target }}-Build
          args: -quit -nographics -batchmode -executeMethod Utilities.Editor.BuildPipeline.UnityPlayerBuildTools.StartCommandLineBuild ${{ matrix.build-args }}

      - name: Validate Text Mesh Pro Resources
        shell: bash
        run: |
          # Only run for Unity versions that are not 6000.x
          UNITY_MAJOR_VERSION=$(echo "${{ matrix.unity-version }}" | cut -d'.' -f1)
          if [ "$UNITY_MAJOR_VERSION" = "6000" ]; then
            echo "Skipping Text Mesh Pro Resources validation for Unity 6000.x versions."
            exit 0
          fi
          # Validate Text Mesh Pro Resources
          TMPRO_PATH="${{ steps.unity-setup.outputs.unity-project-path }}/Assets/TextMesh Pro"
          if [ -d "$TMPRO_PATH" ]; then
            echo "Text Mesh Pro Resources found at $TMPRO_PATH"
          else
            echo "Text Mesh Pro Resources not found at $TMPRO_PATH"
            # list the top level folders in the Assets directory
            ls -al "${{ steps.unity-setup.outputs.unity-project-path }}/Assets"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ${{ github.run_number }}.${{ github.run_attempt }} ${{ matrix.os }} ${{ matrix.unity-version }} ${{ matrix.build-target }} Artifacts
          path: ${{ github.workspace }}/**/*.log
